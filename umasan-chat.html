<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>うまさんに聞いてみる｜旅するうまさん</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:    #120b24;
      --bg-section: #1e1035;
      --bg-card:    #2a1852;
      --text-main:  #fff2d2;
      --text-sub:   #ffe7b2;
      --text-body:  rgba(255,241,209,0.78);
      --gold:       #F4B942;
      --gold-dark:  #C8943A;
      --gold-dim:   rgba(244,185,66,0.25);
      --orb-purple: #6b3fa0;
      --orb-blue:   #1a237e;
      --lantern:    #FF8B3D;
      --ink:        #3a210e;
      --line:       rgba(244,185,66,0.3);
      --shadow:     0 14px 36px rgba(0,0,0,0.4);
      --radius:     24px;
      --header-h:   78px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      padding-top:var(--header-h);
      color:var(--text-body);
      background:
        radial-gradient(circle at 50% 20%,rgba(255,190,90,.08),transparent 28%),
        radial-gradient(circle at 80% 70%,rgba(255,210,120,.06),transparent 24%),
        linear-gradient(180deg,#140822 0%,#1d0c35 42%,#12061f 100%);
      font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",system-ui,sans-serif;
      line-height:1.65;
      overflow-x:hidden;
      min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%;height:auto}
    .wrap{width:min(700px,calc(100% - 32px));margin:auto}

    /* magic particles */
    .magic-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;mix-blend-mode:screen}
    .magic-orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    .magic-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:0.55;mix-blend-mode:screen;will-change:transform}
    .magic-orb--1{width:280px;height:280px;background:radial-gradient(circle,rgba(107,63,160,0.5),rgba(107,63,160,0) 70%);top:10%;left:-10%;animation:orb-drift-a 22s ease-in-out infinite alternate}
    .magic-orb--2{width:360px;height:360px;background:radial-gradient(circle,rgba(244,185,66,0.3),rgba(244,185,66,0) 70%);top:50%;right:-15%;animation:orb-drift-b 28s ease-in-out infinite alternate}
    .magic-orb--3{width:240px;height:240px;background:radial-gradient(circle,rgba(255,139,61,0.4),rgba(255,139,61,0) 70%);bottom:5%;left:30%;animation:orb-drift-c 26s ease-in-out infinite alternate}
    @keyframes orb-drift-a{0%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.15)}100%{transform:translate(160px,-40px) scale(0.95)}}
    @keyframes orb-drift-b{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-100px,-80px) scale(1.1)}100%{transform:translate(-60px,80px) scale(0.9)}}
    @keyframes orb-drift-c{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-60px) scale(1.2)}100%{transform:translate(-80px,-40px) scale(1)}}
    .magic-sparkles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    .magic-sparkle{position:absolute;width:4px;height:4px;background:#ffd23f;border-radius:50%;box-shadow:0 0 8px 2px rgba(255,210,63,0.9),0 0 16px 4px rgba(255,210,63,0.5);opacity:0;animation:sparkle-rise linear infinite}
    .magic-sparkle::before{content:"";position:absolute;inset:-2px;background:inherit;border-radius:inherit;transform:rotate(45deg);box-shadow:inherit}
    @keyframes sparkle-rise{0%{transform:translate(0,0) scale(0);opacity:0}10%{opacity:1;transform:translate(8px,-40px) scale(1)}50%{opacity:0.9;transform:translate(-12px,-200px) scale(0.85)}90%{opacity:0.4}100%{transform:translate(20px,-420px) scale(0);opacity:0}}
    .magic-aurora{position:fixed;inset:-10% -10% -10% -10%;z-index:-1;pointer-events:none;background:conic-gradient(from 0deg at 30% 40%,rgba(107,63,160,0) 0deg,rgba(107,63,160,0.2) 60deg,rgba(244,185,66,0.15) 140deg,rgba(255,139,61,0.15) 220deg,rgba(107,63,160,0) 360deg);filter:blur(80px);opacity:0.55;animation:aurora-spin 60s linear infinite;mix-blend-mode:screen}
    @keyframes aurora-spin{from{transform:rotate(0deg) scale(1.1)}to{transform:rotate(360deg) scale(1.1)}}
    @media(prefers-reduced-motion:reduce){.magic-orb,.magic-sparkle,.magic-aurora{animation:none!important}.magic-canvas{display:none}}

    /* tap spark */
    .tap-spark{position:fixed;width:6px;height:6px;background:#ffd23f;border-radius:50%;pointer-events:none;animation:spark 0.6s ease-out forwards;z-index:999;transform:translate(-50%,-50%)}
    @keyframes spark{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}

    /* header */
    .header{
      position:fixed;top:0;left:0;right:0;z-index:60;
      background:linear-gradient(180deg,#1a0c06,#241008);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(244,185,66,0.3);
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
    }
    .header-inner{
      height:var(--header-h);
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:18px;
    }
    .header-back{
      display:inline-flex;align-items:center;gap:6px;
      color:var(--text-sub);font-size:14px;font-weight:900;
      letter-spacing:.06em;padding:8px 12px;border-radius:8px;
      transition:.22s ease;white-space:nowrap;
    }
    .header-back:hover{color:var(--gold)}
    .header-title{
      text-align:center;font-size:18px;font-weight:900;
      letter-spacing:.06em;color:var(--text-main);
    }
    .header-lantern{width:32px;height:32px;object-fit:contain;justify-self:end}

    /* layout */
    main{position:relative;z-index:1}

    /* description */
    .chat-desc{
      text-align:center;margin:0 auto 20px;
      font-size:15px;font-weight:700;line-height:2;
      color:var(--text-sub);letter-spacing:.03em;
    }

    /* chat-area: bubble + umasan stacked */
    .chat-area{display:flex;flex-direction:column;align-items:center;gap:0}

    /* speech bubble */
    .speech-bubble{
      position:relative;
      background:rgba(200,169,122,0.15);
      border:1.5px solid rgba(244,185,66,0.3);
      border-radius:16px;
      padding:18px 24px;
      color:var(--text-main);
      font-size:15px;font-weight:700;line-height:1.8;
      text-align:center;
      height:120px;
      display:flex;align-items:center;justify-content:center;
      width:100%;max-width:480px;
      box-sizing:border-box;
      white-space:pre-wrap;
    }
    .speech-bubble::after{
      content:"";position:absolute;
      bottom:-14px;left:50%;transform:translateX(-50%);
      border-width:14px 10px 0;border-style:solid;
      border-color:rgba(244,185,66,0.3) transparent transparent;
    }
    .speech-bubble.fade-out{opacity:0;transition:opacity 0.18s ease}
    @keyframes bubble-pop{
      0%  {transform:scale(0.86);opacity:0}
      55% {transform:scale(1.05);opacity:1}
      100%{transform:scale(1);  opacity:1}
    }
    .speech-bubble.bubble-pop{
      animation:bubble-pop 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    /* umasan */
    .umasan-wrap img{width:200px;display:block}

    /* input area */
    .input-area{display:flex;gap:12px;align-items:center}
    .chat-input{
      flex:1;background:rgba(42,24,82,0.7);
      border:1.5px solid var(--gold);border-radius:12px;
      padding:14px 18px;font-size:16px;font-family:inherit;
      color:var(--text-main);outline:none;transition:.22s ease;
    }
    .chat-input::placeholder{color:rgba(255,231,178,0.45)}
    .chat-input:focus{border-color:#ffe07a;box-shadow:0 0 0 3px rgba(244,185,66,0.15)}
    .btn-send{
      display:inline-flex;align-items:center;justify-content:center;
      background:#F4B942;color:#3a210e;
      border:none;border-radius:999px;padding:14px 24px;
      font-size:15px;font-weight:900;font-family:inherit;
      letter-spacing:.05em;cursor:pointer;white-space:nowrap;
      transition:.22s ease;box-shadow:0 4px 16px rgba(244,185,66,0.3);
    }
    .btn-send:hover{background:#f5c842;transform:translateY(-2px);box-shadow:0 8px 24px rgba(244,185,66,0.4)}
    .btn-send:active{transform:none}

    /* history */
    .chat-history{
      display:flex;flex-direction:column;gap:10px;
      min-height:120px;max-height:280px;overflow-y:auto;padding:4px 0;
    }
    .history-item{display:flex;flex-direction:column;gap:4px}
    .history-input{font-size:12px;color:var(--gold);opacity:0.7;letter-spacing:.04em}
    .history-input::before{content:"あなた："}
    .history-answer{
      font-size:14px;color:var(--text-sub);line-height:1.7;
      padding:8px 12px;background:rgba(255,244,230,0.06);
      border-radius:10px;border-left:2px solid rgba(244,185,66,0.4);
    }
    .history-divider{height:1px;background:rgba(244,185,66,0.15);margin:4px 0}

    /* PC 2カラム */
    @media(min-width:821px){
      .chat-main{
        display:grid;grid-template-columns:1fr 1.4fr;
        gap:40px;align-items:start;
        max-width:900px;margin:0 auto;padding:40px 0;
      }
      .chat-left{display:flex;flex-direction:column;align-items:center;gap:20px}
      .chat-right{
        display:flex;flex-direction:column;gap:16px;
        padding:28px;background:rgba(42,24,82,0.5);
        border:1.5px solid rgba(244,185,66,0.25);border-radius:24px;
      }
    }

    /* スマホ縦積み */
    @media(max-width:820px){
      :root{--header-h:52px}
      .chat-main{
        display:flex;flex-direction:column;align-items:center;
        gap:24px;padding:20px 0;
      }
      .chat-left{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
      .chat-right{width:100%}
      .speech-bubble{height:110px;font-size:14px;padding:14px 18px;max-width:320px}
      .umasan-wrap img{width:160px}
      .header-title{font-size:15px}
      .header-back{font-size:13px;padding:6px 8px}
      .chat-input{font-size:15px;padding:12px 14px}
      .btn-send{padding:12px 18px;font-size:14px;width:100%}
      .input-area{flex-direction:column;gap:10px}
      .chat-desc{font-size:14px}
    }
  </style>
</head>
<body>

<div class="magic-aurora" aria-hidden="true"></div>
<div class="magic-orbs" aria-hidden="true">
  <div class="magic-orb magic-orb--1"></div>
  <div class="magic-orb magic-orb--2"></div>
  <div class="magic-orb magic-orb--3"></div>
</div>
<canvas class="magic-canvas" id="magicCanvas" aria-hidden="true"></canvas>
<div class="magic-sparkles" id="magicSparkles" aria-hidden="true"></div>

<header class="header">
  <div class="wrap header-inner">
    <a class="header-back" href="index.html">← 戻る</a>
    <div class="header-title">うまさんに聞いてみる</div>
    <img class="header-lantern" src="assets/icon-lantern.png" alt="">
  </div>
</header>

<main>
  <div class="wrap">
    <div class="chat-main">

      <!-- 左カラム：うまさん -->
      <div class="chat-left">
        <p class="chat-desc">うまさんは、旅の途中で見つけたことを<br>少しだけ覚えているみたい。<br>気になることばを入れてみてね。</p>
        <div class="chat-area">
          <div class="speech-bubble" id="speechBubble"><span id="bubbleText">やっほー。うまさんだよ。
何か気になることば、ある？</span></div>
          <div class="umasan-wrap">
            <img src="assets/umasan-letter.png" alt="うまさん">
          </div>
        </div>
      </div>

      <!-- 右カラム：入力 + 履歴 -->
      <div class="chat-right">
        <div class="input-area">
          <input
            class="chat-input"
            id="chatInput"
            type="text"
            placeholder="ことばを入れる"
            autocomplete="off"
            maxlength="80"
          >
          <button class="btn-send" id="sendBtn">聞いてみる</button>
        </div>
        <div class="chat-history" id="chatHistory"></div>
      </div>

    </div>
  </div>
</main>

<script>
const responses = {
  greeting: {
    keywords: ["こんにちは","こんちは","こんばんは","おはよう","やあ","はじめまして","hello","hi"],
    answers: [
      "こんにちは。今日も、ひとつだけ冒険してみる？",
      "やっほー。うまさんだよ。",
      "来てくれてありがとう。今日はどこへ寄り道しようかな。",
      "おはよう。ランタン、ちゃんと光ってるよ。"
    ]
  },
  thanks: {
    keywords: ["ありがとう","ありがと","感謝","さんきゅ","thank"],
    answers: [
      "こちらこそ。一緒に歩いてくれてありがとう。",
      "えへへ。うまさん、うれしいです。",
      "また小さな冒険、しようね。"
    ]
  },
  bye: {
    keywords: ["ばいばい","またね","さようなら","じゃあね","おやすみ","bye"],
    answers: [
      "またね。帰り道、気をつけてね。",
      "またどこかの寄り道で会おうね。",
      "ランタンのあかり、少しだけ残しておくね。"
    ]
  },
  umasan: {
    keywords: ["うまさん","旅するうまさん","あなた","きみ","だれ"],
    answers: [
      "呼んだ？うまさんだよ。",
      "うまさんは、旅をしている小さな冒険者です。",
      "気になるものがあると、つい寄り道しちゃうんだ。"
    ]
  },
  personality: {
    keywords: ["性格","どんな子","どんなキャラ","どんなこ"],
    answers: [
      "うまさんは、好奇心旺盛で、ちょっとドジな旅人です。",
      "マイペースだけど、不思議なものにはすぐ気づくよ。",
      "急がず、のんびり、一緒に歩くタイプです。"
    ]
  },
  cute: {
    keywords: ["かわいい","すき","好き","かっこいい","すごい"],
    answers: [
      "えへへ。ちょっと照れちゃうね。",
      "ほっぺが、少しだけピンクになった気がするよ。",
      "ありがとう。リュックも喜んでるかも。"
    ]
  },
  cheek: {
    keywords: ["ほっぺ","ほほ","ほほっぺ"],
    answers: [
      "うまさんのほっぺは、ベビーピンクなんだ。",
      "ほっぺをほめられると、ちょっと照れます。",
      "もちもちしてそう？えへへ。"
    ]
  },
  eye: {
    keywords: ["目","め","おめめ","目玉"],
    answers: [
      "うまさんの目は、小さな黒い点です。",
      "よく見ると、ちゃんと見てるよ。",
      "小さいけど、不思議なものは見逃さないよ。"
    ]
  },
  nose: {
    keywords: ["鼻","はな"],
    answers: [
      "うまさんの鼻は、ピンクじゃなくてグレー寄りです。",
      "鼻はちょこんとしてるよ。",
      "くんくん。不思議な寄り道のにおいがするね。"
    ]
  },
  lantern: {
    keywords: ["ランタン","あかり","灯り","ひかり","光","lantern"],
    answers: [
      "このランタンは、ただのあかりじゃないんだ。",
      "暗い道でも、ランタンがあると少し安心だよ。",
      "ランタンの光は、寄り道の入口を見つける手がかりです。",
      "あかりがあると、見えなかったものが少し見えるんだ。"
    ]
  },
  backpack: {
    keywords: ["リュック","冒険リュック","かばん","鞄","バッグ"],
    answers: [
      "リュックには、旅に必要なものがいろいろ入ってるよ。",
      "ちょっと大きめだけど、うまさんには大事な相棒です。",
      "ときどき、何を入れたか忘れちゃうんだ。"
    ]
  },
  roll: {
    keywords: ["マントール","寝袋","ロール","みどり","緑"],
    answers: [
      "リュックの上には、くすみグリーンのマントールがあるよ。",
      "遠くまで旅するときに、きっと役に立つんだ。",
      "まだ使い方は、うまさんも練習中です。"
    ]
  },
  trip: {
    keywords: ["旅","たび","探索","たんさく"],
    answers: [
      "大きな冒険じゃなくても、道ばたの発見も冒険だよ。",
      "今日はどんな小さな冒険にする？",
      "うまさんは、気になるものを見つけるとすぐ旅に出たくなるんだ。"
    ]
  },
  adventure: {
    keywords: ["冒険","ぼうけん"],
    answers: [
      "大きな冒険じゃなくても、道ばたの発見も冒険だよ。",
      "今日はどんな小さな冒険にする？",
      "うまさんは、気になるものを見つけるとすぐ旅に出たくなるんだ。"
    ]
  },
  detour: {
    keywords: ["寄り道","よりみち","まわり道","遠回り"],
    answers: [
      "寄り道は、まちがいじゃないよ。",
      "まっすぐ行かないから、見つかる景色もあるんだ。",
      "少しだけ遠回りすると、面白いものに会えるかも。"
    ]
  },
  nonroutine: {
    keywords: ["非日常","ひにちじょう","小さな非日常"],
    answers: [
      "非日常って、案外すぐ近くにあるのかも。",
      "いつもの道も、少し見方を変えると冒険になるよ。",
      "うまさんは、日常のすみっこにある不思議が好きです。"
    ]
  },
  world: {
    keywords: ["世界","異世界","別世界","むこう","向こう"],
    answers: [
      "世界は、ひとつじゃないかもしれないね。",
      "うまさんは、いろんな世界を旅しているよ。",
      "ここも、うまさんにとっては大切な旅先です。",
      "別世界って、遠くにあるとは限らないんだ。"
    ]
  },
  door: {
    keywords: ["扉","とびら","入口","いりぐち","ドア","ゲート"],
    answers: [
      "扉は、開けるものというより、見つけるものかも。",
      "入口は、いつもの景色の中に隠れていることがあるよ。",
      "うまさんは、物語の扉を探して旅しています。"
    ]
  },
  return: {
    keywords: ["帰り道","かえりみち","帰る","かえる","もどる"],
    answers: [
      "寄り道してもいい。でも、帰り道は覚えておこうね。",
      "帰る場所があると、冒険はもっと楽しくなるよ。",
      "うまさんも、ときどき帰り道をメモします。"
    ]
  },
  quest: {
    keywords: ["quest","クエスト","挑戦状","ちょうせんじょう","今日の挑戦"],
    answers: [
      "QUESTは、毎日の小さな冒険のきっかけです。",
      "今日の挑戦状、やってみる？",
      "毎朝7時に、小さな冒険が届くんだ。"
    ]
  },
  note: {
    keywords: ["note","ノート","冒険記","ぼうけんき","記事","ブログ"],
    answers: [
      "NOTEには、うまさんの冒険記があります。",
      "体験型エンタメや謎解き、没入型アートの記録をまとめているよ。",
      "気になる冒険記があったら、読んでみてね。",
      "旅の記録は、あとから読み返すとまた楽しいんだ。"
    ]
  },
  goods: {
    keywords: ["goods","グッズ","にちじょう","日常"],
    answers: [
      "GOODSには、うまさんのいる日常があります。",
      "スマホに、会話に、おでかけに。うまさんを連れていけるよ。",
      "日常の中に、少しだけうまさんを置いてみてね。"
    ]
  },
  wallpaper: {
    keywords: ["壁紙","かべがみ","スマホ壁紙","待ち受け","まちうけ"],
    answers: [
      "スマホ壁紙は、季節に合わせたうまさんの待ち受けです。",
      "スマホの中にも、小さな旅先を作れたらいいな。",
      "待ち受けにしたら、うまさんも一緒におでかけ気分です。"
    ]
  },
  stamp: {
    keywords: ["line","ライン","スタンプ","lineスタンプ"],
    answers: [
      "LINEスタンプでは、日常の会話にうまさんが登場します。",
      "ゆるくてかわいいうまさんを、会話に連れていけるよ。",
      "ありがとう、了解、わくわく……いろんな気持ちを届けたいな。"
    ]
  },
  suzuri: {
    keywords: ["suzuri","スズリ","tシャツ","パーカー","スマホケース","ステッカー"],
    answers: [
      "SUZURIには、うまさんグッズがあります。",
      "Tシャツやスマホケース、ステッカーにもなっているよ。",
      "おでかけに連れていってもらえたら、うまさんうれしいです。"
    ]
  },
  x: {
    keywords: ["twitter","ツイッター","つぶやき","ポスト"],
    answers: [
      "Xでは、冒険記や挑戦状のお知らせをしています。",
      "うまさんからの挑戦状も、Xで見られるよ。",
      "見つけた小さな冒険、よかったら投稿してね。"

function getResponse(input) {
  const normalized = input
    .toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, ' ')
    .trim();

  if (!normalized) return null;

  for (const category of Object.values(responses)) {
    for (const keyword of category.keywords) {
      if (normalized.includes(keyword.toLowerCase())) {
        const answers = category.answers;
        return answers[Math.floor(Math.random() * answers.length)];
      }
    }
  }
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

let typewriterTimer = null;
const history = [];

function typewrite(el, text, i) {
  if (i >= text.length) { typewriterTimer = null; return; }
  el.textContent = text.slice(0, i + 1);
  typewriterTimer = setTimeout(() => typewrite(el, text, i + 1), 38);
}

function showResponse(text) {
  const bubble = document.getElementById('speechBubble');
  const el = document.getElementById('bubbleText');

  if (typewriterTimer !== null) { clearTimeout(typewriterTimer); typewriterTimer = null; }

  bubble.classList.remove('bubble-pop');
  bubble.classList.add('fade-out');
  el.textContent = '';

  setTimeout(() => {
    bubble.classList.remove('fade-out');
    bubble.classList.add('bubble-pop');
    setTimeout(() => bubble.classList.remove('bubble-pop'), 420);
    setTimeout(() => typewrite(el, text, 0), 210);
  }, 200);
}

function renderHistory() {
  const container = document.getElementById('chatHistory');
  if (!container) return;
  container.innerHTML = '';
  history.forEach((item, i) => {
    if (i > 0) {
      const div = document.createElement('div');
      div.className = 'history-divider';
      container.appendChild(div);
    }
    const entry = document.createElement('div');
    entry.className = 'history-item';
    const inp = document.createElement('div');
    inp.className = 'history-input';
    inp.textContent = item.input;
    const ans = document.createElement('div');
    ans.className = 'history-answer';
    ans.textContent = item.answer;
    entry.appendChild(inp);
    entry.appendChild(ans);
    container.appendChild(entry);
  });
}

function submit() {
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  const answer = getResponse(val);
  if (!answer) return;
  history.unshift({ input: val, answer });
  if (history.length > 3) history.pop();
  renderHistory();
  showResponse(answer);
  input.value = '';
  input.focus();
}

document.getElementById('sendBtn').addEventListener('click', submit);
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submit();
});

// magic canvas
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas=document.getElementById('magicCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  let W=0,H=0;
  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize',resize);
  const COLORS=['#ffd23f','#ffe27a','#ffd23f','#ff8b3d','#ffffff','#7be0d6'];
  const wisps=[];
  const WISP_COUNT=window.innerWidth<720?28:55;
  for(let i=0;i<WISP_COUNT;i++) wisps.push(makeWisp());
  function makeWisp(){
    return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:-.15-Math.random()*.35,r:.6+Math.random()*1.8,life:Math.random(),ttl:220+Math.random()*380,age:0,c:COLORS[Math.floor(Math.random()*COLORS.length)],wob:Math.random()*Math.PI*2,wobSpd:.005+Math.random()*.012};
  }
  const shooters=[];
  function maybeSpawnShooter(){
    if(Math.random()<.004&&shooters.length<2) shooters.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*4,vy:4+Math.random()*3,life:1,tail:[]});
  }
  function step(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<wisps.length;i++){
      const w=wisps[i];w.age++;w.wob+=w.wobSpd;w.x+=w.vx+Math.sin(w.wob)*.4;w.y+=w.vy;
      const t=w.age/w.ttl;
      const alpha=t<.15?t/.15:(t>.7?Math.max(0,(1-t)/.3):1);
      ctx.globalAlpha=alpha*.85;
      const grad=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r*6);
      grad.addColorStop(0,w.c);grad.addColorStop(.4,w.c+'88');grad.addColorStop(1,'transparent');
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(w.x,w.y,w.r*6,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=alpha;ctx.fillStyle=w.c;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.fill();
      if(w.age>w.ttl||w.y<-30||w.x<-30||w.x>W+30){wisps[i]=makeWisp();wisps[i].y=H+10;}
    }
    maybeSpawnShooter();
    for(let s=shooters.length-1;s>=0;s--){
      const sh=shooters[s];sh.tail.unshift({x:sh.x,y:sh.y});
      if(sh.tail.length>18) sh.tail.pop();
      sh.x+=sh.vx;sh.y+=sh.vy;sh.life-=.012;
      ctx.globalAlpha=Math.max(0,sh.life);ctx.strokeStyle='#fff7c2';ctx.lineWidth=2;ctx.beginPath();
      for(let k=0;k<sh.tail.length;k++){const p=sh.tail[k];if(k===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
      ctx.stroke();
      const sg=ctx.createRadialGradient(sh.x,sh.y,0,sh.x,sh.y,14);
      sg.addColorStop(0,'rgba(255,247,194,1)');sg.addColorStop(1,'rgba(255,247,194,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sh.x,sh.y,14,0,Math.PI*2);ctx.fill();
      if(sh.life<=0||sh.y>H+20) shooters.splice(s,1);
    }
    ctx.globalAlpha=1;requestAnimationFrame(step);
  }
  step();
})();
