<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅するうまさんカメラ</title>
  <style>
    /* ========================
       CSS 変数・リセット
    ======================== */
    :root {
      --gold: #F4B942;
      --brown: #3E2A1E;
      --cream: #FFF4E6;
      --panel-bg: rgba(30, 18, 8, 0.78);
      --panel-border: rgba(244, 185, 66, 0.22);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
    }

    /* ========================
       カメラ映像（背景）
    ======================== */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* ========================
       うまさん（ドラッグ対象）
    ======================== */
    #umasan {
      position: fixed;
      width: 160px;
      height: auto;
      cursor: grab;
      z-index: 3;
      touch-action: none;   /* ブラウザのスクロールを抑制 */
      -webkit-user-drag: none;
    }

    #umasan:active {
      cursor: grabbing;
    }

    /* ========================
       上部オーバーレイ（グラデーション + メッセージ + 切替ボタン）
    ======================== */
    #top-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 16px 48px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.58) 0%, transparent 100%);
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;   /* メッセージ領域はタップ透過 */
    }

    #status-message {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(0,0,0,0.75);
      padding-top: 10px;
      padding-left: 4px;
      flex: 1;
      line-height: 1.5;
    }

    #flip-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: all;   /* ボタンだけタップ有効 */
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #flip-btn:active {
      background: rgba(244, 185, 66, 0.35);
    }

    /* ========================
       下部パネル（半透明・固定）
    ======================== */
    #bottom-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--panel-bg);
      border-top: 1.5px solid var(--panel-border);
      border-radius: 24px 24px 0 0;
      z-index: 5;
      padding: 16px 20px;
      /* iOS ホームバー対応 */
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /* ========================
       ポーズ選択（横スクロール）
    ======================== */
    #pose-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    #pose-selector::-webkit-scrollbar {
      display: none;
    }

    .pose-thumb {
      flex-shrink: 0;
      width: 62px;
      height: 62px;
      border-radius: 14px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-size: 28px;   /* 画像失敗時の絵文字サイズ */
    }

    .pose-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 選択中はゴールド枠 */
    .pose-thumb.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2.5px rgba(244, 185, 66, 0.32);
    }

    /* ========================
       ボタン行
    ======================== */
    #btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* 保存・X投稿ボタン（小） */
    #btn-save,
    #btn-x {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, background 0.15s;
      flex-shrink: 0;
    }

    #btn-save:disabled,
    #btn-x:disabled {
      opacity: 0.32;
      cursor: not-allowed;
    }

    #btn-save:not(:disabled):active,
    #btn-x:not(:disabled):active {
      background: rgba(244, 185, 66, 0.28);
    }

    /* 撮影ボタン（大・中央） */
    #btn-capture {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3.5px solid var(--gold);
      background: var(--gold);
      color: var(--brown);
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 28px;
      box-shadow: 0 0 0 5px rgba(244, 185, 66, 0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      flex-shrink: 0;
    }

    #btn-capture:active {
      transform: scale(0.91);
      box-shadow: 0 0 0 2px rgba(244, 185, 66, 0.25);
    }

    /* ========================
       撮影後プレビュー
    ======================== */
    #preview-section {
      display: none;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }

    #preview-section.visible {
      display: flex;
    }

    #preview-img {
      height: 72px;
      width: auto;
      max-width: 120px;
      border-radius: 10px;
      border: 1.5px solid var(--panel-border);
      object-fit: cover;
      flex-shrink: 0;
    }

    #btn-retake {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-size: 13px;
      padding: 8px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }

    #btn-retake:active {
      background: rgba(255, 255, 255, 0.22);
    }

    /* ========================
       フラッシュ演出
    ======================== */
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.06s ease-in-out;
    }

    #flash.on {
      opacity: 1;
    }

    /* ========================
       エラーメッセージ
    ======================== */
    #error-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
    }

    #error-overlay.visible {
      display: flex;
    }

    #error-box {
      background: #1a1008;
      color: #fff;
      font-size: 15px;
      text-align: center;
      padding: 28px 32px;
      border-radius: 20px;
      border: 1.5px solid rgba(244, 185, 66, 0.4);
      line-height: 1.8;
      max-width: 300px;
    }

    /* 非表示キャンバス（撮影合成用） */
    #canvas {
      display: none;
    }
  </style>
</head>
<body>

<!-- ■ カメラ映像（背景フルスクリーン） -->
<video id="video" autoplay playsinline muted></video>

<!-- ■ 合成用キャンバス（非表示） -->
<canvas id="canvas"></canvas>

<!-- ■ フラッシュ演出レイヤー -->
<div id="flash"></div>

<!-- ■ うまさん（ドラッグ・ピンチ操作） -->
<img id="umasan" src="umasan1.png" alt="うまさん" draggable="false">

<!-- ■ 上部オーバーレイ -->
<div id="top-overlay">
  <div id="status-message">うまさんを好きな場所に置いてね🐴</div>
  <button id="flip-btn" title="カメラ切り替え">🔄</button>
</div>

<!-- ■ エラー表示 -->
<div id="error-overlay">
  <div id="error-box"></div>
</div>

<!-- ■ 下部パネル -->
<div id="bottom-panel">

  <!-- 1. ポーズ選択（横スクロール） -->
  <div id="pose-selector">
    <div class="pose-thumb selected" data-pose="1" data-src="umasan1.png">
      <img src="umasan1.png" alt="ポーズ1" onerror="this.parentNode.innerHTML='🐴'">
    </div>
    <div class="pose-thumb" data-pose="2" data-src="umasan2.png">
      <img src="umasan2.png" alt="ポーズ2" onerror="this.parentNode.innerHTML='🐎'">
    </div>
    <div class="pose-thumb" data-pose="3" data-src="umasan3.png">
      <img src="umasan3.png" alt="ポーズ3" onerror="this.parentNode.innerHTML='🏇'">
    </div>
    <div class="pose-thumb" data-pose="4" data-src="umasan4.png">
      <img src="umasan4.png" alt="ポーズ4" onerror="this.parentNode.innerHTML='🌟'">
    </div>
  </div>

  <!-- 2. ボタン行 -->
  <div id="btn-row">
    <button id="btn-save" disabled title="保存">💾</button>
    <button id="btn-capture" title="撮影">📷</button>
    <button id="btn-x" disabled title="Xに投稿">𝕏</button>
  </div>

  <!-- 3. 撮影後プレビュー（撮影後に表示） -->
  <div id="preview-section">
    <img id="preview-img" alt="撮影プレビュー">
    <button id="btn-retake">もう一度撮る</button>
  </div>

</div>

<script>
  // ================================================================
  // 状態変数
  // ================================================================
  let stream       = null;
  let facingMode   = 'environment';  // 背面カメラ優先
  let capturedUrl  = null;           // 撮影済み DataURL

  // うまさんの位置・スケール（px 基準）
  let uX = 0, uY = 0;
  let uScale = 1.0;
  const U_BASE = 160;   // 初期サイズ

  // ================================================================
  // DOM 参照
  // ================================================================
  const video          = document.getElementById('video');
  const canvas         = document.getElementById('canvas');
  const ctx            = canvas.getContext('2d');
  const umasanEl       = document.getElementById('umasan');
  const flashEl        = document.getElementById('flash');
  const statusMsg      = document.getElementById('status-message');
  const flipBtn        = document.getElementById('flip-btn');
  const btnSave        = document.getElementById('btn-save');
  const btnCapture     = document.getElementById('btn-capture');
  const btnX           = document.getElementById('btn-x');
  const previewSection = document.getElementById('preview-section');
  const previewImg     = document.getElementById('preview-img');
  const btnRetake      = document.getElementById('btn-retake');
  const errorOverlay   = document.getElementById('error-overlay');
  const errorBox       = document.getElementById('error-box');
  const poseSelector   = document.getElementById('pose-selector');

  // ================================================================
  // カメラ起動 / 切替
  // ================================================================
  async function startCamera(facing) {
    // 既存のストリームを停止
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facing },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      showError(
        'カメラを起動できませんでした📷\n\n' +
        'カメラの使用を許可してから\nページを再読み込みしてください。'
      );
    }
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorOverlay.classList.add('visible');
  }

  // エラーオーバーレイをタップで閉じる
  errorOverlay.addEventListener('click', () => {
    errorOverlay.classList.remove('visible');
  });

  // ================================================================
  // うまさん 初期位置（画面中央）
  // ================================================================
  function centerUmasan() {
    uX = (window.innerWidth  - U_BASE * uScale) / 2;
    uY = (window.innerHeight - U_BASE * uScale) / 2;
    applyUmasanStyle();
  }

  function applyUmasanStyle() {
    umasanEl.style.width  = (U_BASE * uScale) + 'px';
    umasanEl.style.left   = uX + 'px';
    umasanEl.style.top    = uY + 'px';
  }

  // ================================================================
  // ドラッグ操作（mouse）
  // ================================================================
  let dragging = false;
  let dragSX = 0, dragSY = 0, imgSX = 0, imgSY = 0;

  umasanEl.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true;
    dragSX = e.clientX;
    dragSY = e.clientY;
    imgSX  = uX;
    imgSY  = uY;
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    uX = imgSX + (e.clientX - dragSX);
    uY = imgSY + (e.clientY - dragSY);
    applyUmasanStyle();
  });

  window.addEventListener('mouseup', () => { dragging = false; });

  // ================================================================
  // タッチ操作（ドラッグ＋ピンチ）
  // ================================================================
  let touchDragging = false;
  let pinching      = false;
  let pinchStartDist  = 0;
  let pinchStartScale = 1;

  function touchDist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }

  umasanEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length >= 2) {
      // ピンチ開始
      pinching       = true;
      touchDragging  = false;
      pinchStartDist  = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = uScale;
    } else {
      // 1本指ドラッグ開始
      pinching      = false;
      touchDragging = true;
      dragSX = e.touches[0].clientX;
      dragSY = e.touches[0].clientY;
      imgSX  = uX;
      imgSY  = uY;
    }
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (pinching && e.touches.length >= 2) {
      e.preventDefault();
      const dist = touchDist(e.touches[0], e.touches[1]);
      uScale = Math.max(0.25, Math.min(4.5, pinchStartScale * dist / pinchStartDist));
      applyUmasanStyle();
    } else if (touchDragging && e.touches.length === 1) {
      uX = imgSX + (e.touches[0].clientX - dragSX);
      uY = imgSY + (e.touches[0].clientY - dragSY);
      applyUmasanStyle();
    }
  }, { passive: false });

  window.addEventListener('touchend', e => {
    if (e.touches.length < 2) pinching      = false;
    if (e.touches.length === 0) touchDragging = false;
  });

  // ================================================================
  // ポーズ選択
  // ================================================================
  poseSelector.addEventListener('click', e => {
    const thumb = e.target.closest('.pose-thumb');
    if (!thumb) return;
    document.querySelectorAll('.pose-thumb').forEach(t => t.classList.remove('selected'));
    thumb.classList.add('selected');
    umasanEl.src = thumb.dataset.src;
  });

  // ================================================================
  // カメラ前面/背面 切替
  // ================================================================
  flipBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera(facingMode);
  });

  // ================================================================
  // フラッシュ演出（120ms 点滅）
  // ================================================================
  function triggerFlash() {
    return new Promise(resolve => {
      flashEl.classList.add('on');
      setTimeout(() => {
        flashEl.classList.remove('on');
        setTimeout(resolve, 60);
      }, 120);
    });
  }

  // ================================================================
  // 撮影処理
  // object-fit: cover のクロップ範囲を正しく計算して canvas に合成
  // ================================================================
  btnCapture.addEventListener('click', async () => {
    await triggerFlash();

    // video の実解像度
    const vW = video.videoWidth  || video.clientWidth;
    const vH = video.videoHeight || video.clientHeight;

    // 画面の表示サイズ
    const dW = window.innerWidth;
    const dH = window.innerHeight;

    // object-fit: cover のクロップ計算
    // --- カメラ映像のアスペクト比が画面より横長 → 左右をクロップ
    // --- 縦長の場合は上下をクロップ
    const vAsp = vW / vH;
    const dAsp = dW / dH;
    let srcX, srcY, srcW, srcH;

    if (vAsp > dAsp) {
      srcH = vH;
      srcW = vH * dAsp;
      srcX = (vW - srcW) / 2;
      srcY = 0;
    } else {
      srcW = vW;
      srcH = vW / dAsp;
      srcX = 0;
      srcY = (vH - srcH) / 2;
    }

    // canvas を表示サイズに合わせる
    canvas.width  = dW;
    canvas.height = dH;

    // ① カメラ映像を描画
    ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, dW, dH);

    // ② うまさんを重ねて描画
    const uImg = new Image();
    uImg.crossOrigin = 'anonymous';

    uImg.onload = () => {
      const uW = U_BASE * uScale;
      // 元画像のアスペクト比を維持した高さ
      const uH = uW * (uImg.naturalHeight / uImg.naturalWidth);
      ctx.drawImage(uImg, uX, uY, uW, uH);
      finishCapture();
    };

    uImg.onerror = () => {
      // うまさん画像が読めなくてもカメラ映像だけ保存
      finishCapture();
    };

    uImg.src = umasanEl.src;
  });

  function finishCapture() {
    capturedUrl = canvas.toDataURL('image/jpeg', 0.92);

    // プレビュー表示
    previewImg.src = capturedUrl;
    previewSection.classList.add('visible');

    // 状態更新
    statusMsg.textContent = '今日の冒険、撮れたよ🐴';
    btnSave.disabled = false;
    btnX.disabled    = false;
  }

  // ================================================================
  // 保存処理（iOS: 新タブで長押し保存 / その他: ダウンロード）
  // ================================================================
  btnSave.addEventListener('click', () => {
    if (!capturedUrl) return;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
      const win = window.open('', '_blank');
      win.document.write(
        '<html><head><meta name="viewport" content="width=device-width">' +
        '<title>うまさん写真</title></head>' +
        '<body style="margin:0;background:#000;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;min-height:100vh;">' +
        '<img src="' + capturedUrl + '" style="max-width:100%;">' +
        '<p style="color:#fff;font-size:14px;margin-top:16px;text-align:center;' +
        'padding:0 20px;line-height:1.8;">画像を長押しして<br>「写真に追加」で保存してね🐴</p>' +
        '</body></html>'
      );
      win.document.close();
    } else {
      const a = document.createElement('a');
      a.download = 'umasan_' + Date.now() + '.jpg';
      a.href     = capturedUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  });

  // ================================================================
  // X（Twitter）投稿
  // ================================================================
  btnX.addEventListener('click', () => {
    const text =
      '今日、うまさんと小さな冒険をしてきました🐴\n' +
      '#旅するうまさん #うまさんのいる日常';
    window.open(
      'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text),
      '_blank'
    );
  });

  // ================================================================
  // もう一度撮る
  // ================================================================
  btnRetake.addEventListener('click', () => {
    capturedUrl  = null;
    previewSection.classList.remove('visible');
    statusMsg.textContent = 'うまさんを好きな場所に置いてね🐴';
    btnSave.disabled = true;
    btnX.disabled    = true;
  });

  // ================================================================
  // 起動処理
  // ================================================================
  (async () => {
    await startCamera(facingMode);
    centerUmasan();
  })();
</script>
</body>
</html>
