    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', sans-serif;

<body>
  <div class="page-list-container">
    <div class="page-list-header">
      <h1>📄 ページ一覧</h1>
      <a href="javascript:history.back()" class="page-list-back">← 戻る</a>
    </div>
    <div class="page-list-popup__body" id="page-list-body">
      <p style="padding:1rem;color:#888;">読み込み中...</p>
    </div>
  </div>

<script>window.YACHO_BASE = "./"; window.YACHO_PROVIDER_MODE = "json";</script>
<script type="module">
import { initVisitTracker, whenReady, getProgress } from './assets/js/core/visitTracker.js';
import { renderPageList } from './assets/js/core/ui/pageListRenderer.js';

initVisitTracker();
whenReady().then(() => {
  const progress = getProgress();
  const container = document.getElementById('page-list-body');
  container.innerHTML = '';
  const showUnvisitedTitle = false;
  renderPageList(container, progress, { showUnvisitedTitle });
});
</script>
